name: immortalwrt-25.12-closed-110m-builder

on:
  schedule:
    - cron: '0 20 * * *'
  repository_dispatch:
    types: [Update-25.12-Closed-110m]
  workflow_dispatch:

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git
  REPO_BRANCH: 25.12
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: ax6000-closed-110m.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2-closed-110m.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  FIRMWARE_TAG: immortalwrt-ax6000-25.12-closed-110m
  TZ: Asia/Shanghai

jobs:
  check_update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      upstream_hash: ${{ steps.check.outputs.upstream_hash }}
      main_sha: ${{ steps.check.outputs.main_sha }}
      oc_sha: ${{ steps.check.outputs.oc_sha }}
      vt_sha: ${{ steps.check.outputs.vt_sha }}
      last_main_sha: ${{ steps.check.outputs.last_main_sha }}
      last_oc_sha: ${{ steps.check.outputs.last_oc_sha }}
      last_vt_sha: ${{ steps.check.outputs.last_vt_sha }}
    steps:
    - name: Check upstream commits
      id: check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -e
        MAIN_SHA=$(git ls-remote "$REPO_URL" "refs/heads/$REPO_BRANCH" | awk '{print substr($1,1,7)}')
        OC_SHA=$(git ls-remote "https://github.com/vernesong/OpenClash.git" HEAD | awk '{print substr($1,1,7)}')
        VT_SHA=$(git ls-remote "https://github.com/anothaDev/luci-theme-vantage.git" HEAD | awk '{print substr($1,1,7)}')
        if [ -z "$MAIN_SHA" ] || [ -z "$OC_SHA" ] || [ -z "$VT_SHA" ]; then
          echo "获取上游提交哈希失败，终止本次检查"
          exit 1
        fi
        CURRENT_HASH="main:${MAIN_SHA}|openclash:${OC_SHA}|vantage:${VT_SHA}"
        echo "upstream_hash=${CURRENT_HASH}" >> "$GITHUB_OUTPUT"
        echo "main_sha=${MAIN_SHA}" >> "$GITHUB_OUTPUT"
        echo "oc_sha=${OC_SHA}" >> "$GITHUB_OUTPUT"
        echo "vt_sha=${VT_SHA}" >> "$GITHUB_OUTPUT"
        echo "当前上游版本: ${CURRENT_HASH}"

        LAST_BODY=$(gh release view --repo "${{ github.repository }}" --json body -q '.body' 2>/dev/null || true)
        LAST_HASH_LINE=$(echo "$LAST_BODY" | grep -oE 'UPSTREAM_HASH=[^[:space:]]+' | head -n 1 || true)
        LAST_MAIN=$(echo "$LAST_HASH_LINE" | grep -oP '(?<=main:)[a-f0-9]+' || true)
        LAST_OC=$(echo "$LAST_HASH_LINE" | grep -oP '(?<=openclash:)[a-f0-9]+' || true)
        LAST_VT=$(echo "$LAST_HASH_LINE" | grep -oP '(?<=vantage:)[a-f0-9]+' || true)
        echo "last_main_sha=${LAST_MAIN}" >> "$GITHUB_OUTPUT"
        echo "last_oc_sha=${LAST_OC}" >> "$GITHUB_OUTPUT"
        echo "last_vt_sha=${LAST_VT}" >> "$GITHUB_OUTPUT"

        if [ "${{ github.event_name }}" != "schedule" ]; then
          echo "手动或事件触发，强制执行编译"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if echo "$LAST_BODY" | grep -qF "UPSTREAM_HASH=${CURRENT_HASH}"; then
          echo "上游无新提交，跳过本次编译"
          echo "should_build=false" >> "$GITHUB_OUTPUT"
        else
          echo "检测到上游更新，启动自动编译"
          echo "should_build=true" >> "$GITHUB_OUTPUT"
        fi

  build:
    needs: check_update
    if: needs.check_update.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
      actions: write
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Initialization environment
      timeout-minutes: 15
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -e
        sudo find /etc/apt/sources.list.d -type f ! -name ubuntu.sources -delete 2>/dev/null || true
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo -E apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
        sudo -E apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Options::="--force-confold" install -y --no-install-recommends \
          bison build-essential bzip2 ca-certificates cpio curl device-tree-compiler \
          file flex gawk gettext git jq libelf-dev libncurses-dev libssl-dev \
          patch pkgconf python3 python3-setuptools rsync swig time unzip wget \
          xz-utils zlib1g-dev zstd
        sudo -E apt-get clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        df -hT /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        git clone -b $REPO_BRANCH --single-branch --filter=blob:none $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> "$GITHUB_OUTPUT"
        grep '^CONFIG_TARGET_DEVICE_.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> "$GITHUB_ENV"
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> "$GITHUB_ENV"

    - name: Organize files
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outcome == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> "$GITHUB_ENV"

    - name: Upload firmware directory
      uses: actions/upload-artifact@v4
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outcome == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        retention-days: 7

    - name: Generate release tag and changelog
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outcome == 'success' && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        MAIN_SHA: ${{ needs.check_update.outputs.main_sha }}
        OC_SHA: ${{ needs.check_update.outputs.oc_sha }}
        VT_SHA: ${{ needs.check_update.outputs.vt_sha }}
        LAST_MAIN: ${{ needs.check_update.outputs.last_main_sha }}
        LAST_OC: ${{ needs.check_update.outputs.last_oc_sha }}
        LAST_VT: ${{ needs.check_update.outputs.last_vt_sha }}
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")-${{ env.FIRMWARE_TAG }}" >> "$GITHUB_OUTPUT"

        append_changelog() {
          local title="$1"
          local repo="$2"
          local old_sha="$3"
          local new_sha="$4"
          echo "### ${title} (\`${new_sha}\`)" >> release.txt
          if [ -z "$old_sha" ]; then
            echo "- 首次记录基线版本，无历史对比记录。" >> release.txt
          elif [ "$old_sha" = "$new_sha" ]; then
            echo "- 无新增提交。" >> release.txt
          else
            echo "- 完整对比：https://github.com/${repo}/compare/${old_sha}...${new_sha}" >> release.txt
            curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${repo}/compare/${old_sha}...${new_sha}" \
              | jq -r '.commits[-30:][] | "- `\(.sha[0:7])` \(.commit.message | split("\n")[0]) (\(.commit.author.name))"' >> release.txt \
              || echo "- 获取提交记录失败，请点击上方对比链接查看。" >> release.txt
          fi
          echo "" >> release.txt
        }

        echo "## 上游源码更新日志" > release.txt
        echo "" >> release.txt
        append_changelog "ImmortalWrt 主源码 (25.12)" "chasey-dev/immortalwrt-mt798x-rebase" "$LAST_MAIN" "$MAIN_SHA"
        append_changelog "OpenClash" "vernesong/OpenClash" "$LAST_OC" "$OC_SHA"
        append_changelog "luci-theme-vantage" "anothaDev/luci-theme-vantage" "$LAST_VT" "$VT_SHA"
        echo "---" >> release.txt
        echo "UPSTREAM_HASH=${{ needs.check_update.outputs.upstream_hash }}" >> release.txt

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v2
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outcome == 'success' && !cancelled()
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        name: ImmortalWrt AX6000 Closed Driver 110m ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
        overwrite_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Clean up old releases (keep latest 3)
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outcome == 'success' && !cancelled()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release list --repo "${{ github.repository }}" --limit 100 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' | while IFS= read -r tag; do
          [ -n "$tag" ] && echo "删除旧 Release 及标签: $tag" && gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
        done

    - name: Send Bark notification
      if: always() && !cancelled()
      env:
        BARK_URL: ${{ secrets.BARK_URL }}
        COMPILE_OUTCOME: ${{ steps.compile.outcome }}
        RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
        MAIN_SHA: ${{ needs.check_update.outputs.main_sha }}
        OC_SHA: ${{ needs.check_update.outputs.oc_sha }}
        VT_SHA: ${{ needs.check_update.outputs.vt_sha }}
        LAST_MAIN: ${{ needs.check_update.outputs.last_main_sha }}
        LAST_OC: ${{ needs.check_update.outputs.last_oc_sha }}
        LAST_VT: ${{ needs.check_update.outputs.last_vt_sha }}
      run: |
        [ -z "$BARK_URL" ] && echo "未配置 BARK_URL，跳过推送" && exit 0
        BARK_URL="${BARK_URL%/}"

        UPDATED=""
        if [ -z "$LAST_MAIN" ]; then
          UPDATED="首次基线编译"
        else
          [ "$LAST_MAIN" != "$MAIN_SHA" ] && UPDATED="${UPDATED}ImmortalWrt主源码、"
          [ "$LAST_OC" != "$OC_SHA" ] && UPDATED="${UPDATED}OpenClash、"
          [ "$LAST_VT" != "$VT_SHA" ] && UPDATED="${UPDATED}Vantage主题、"
          UPDATED="${UPDATED%、}"
          [ -z "$UPDATED" ] && UPDATED="无上游变更（手动触发）"
        fi

        if [ "$COMPILE_OUTCOME" = "success" ]; then
          TITLE="AX6000 固件编译成功"
          BODY=$(printf "更新项：%s\n新版本：%s" "$UPDATED" "$RELEASE_TAG")
          JUMP_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
        else
          TITLE="AX6000 固件编译失败"
          BODY=$(printf "更新项：%s\n构建未完成，点击查看 Actions 日志" "$UPDATED")
          JUMP_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        fi
        PAYLOAD=$(jq -n --arg title "$TITLE" --arg body "$BODY" --arg url "$JUMP_URL" \
          '{title: $title, body: $body, group: "Redmi-AX6000", url: $url}')
        curl -fsS -X POST "$BARK_URL" \
          -H 'Content-Type: application/json; charset=utf-8' \
          -d "$PAYLOAD"
